<div class="cd">${[['Oksigen terlarut','wave','mg/L'],['pH','drop',''],['Suhu air','therm','°C']].map((r,i)=>`<div class="mr"><span class="ib2 sm">${I(r[1],18)}</span><div class="hx2"><b>${r[0]}</b><small id="d${i}">Perubahan 1 menit: –</small></div><div class="mv"><b id="v${i}">–</b> <small>${r[2]}</small><em id="s${i}">Menstabil</em></div></div>`).join('')}</div>

R.mes=()=>{let t=0;const run=G.run,tg=ST[run=='lost'?'aman':run],base=[.6,.2,1.2],th=[.65,.55,.7],mm=s=>pad(s/60|0)+':'+pad(s%60|0),pad=n=>String(n).padStart(2,'0');

const v=[tg.do,tg.ph,tg.t];let ok=0;v.forEach((x,i)=>{const r=Math.max(0,1-p/th[i]),s=r==0;ok+=s;const c=x+[.5,.15,1.2][i]*r*Math.sin(t/9),dl=s?[.1,.05,.1][i]:base[i]*r+[.1,.05,.1][i];
$('v'+i).textContent=f(c,i==1?1:1);$('d'+i).textContent='Perubahan 1 menit: '+(i==1?f(dl,2):f(dl))+(i==0?' mg/L':i==2?' °C':'');$('s'+i).textContent=s?'Stabil':'Menstabil'});
if(run=='lost'&&t>=372){clearInterval(T);G.lostAt=t;go('lost');return}
if(ok==3){clearInterval(T);$('chp').innerHTML='Sensor stabil';setTimeout(()=>{if(G.scr!='mes')return;if(run=='aman'){G.cur='aman';toast('Pengukuran selesai · kolam aman');go('home')}else{G.cur=run;go('res')}},1100)}},100)};
V.wait=()=>hb('Pengukuran','Kolam A1 · Sesi 1 dari '+G.ses,'','cancel')+`<div class="rw" style="padding:20px 0"><svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="68" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-dasharray="6 8"><animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="20s" repeatCount="indefinite"/></circle><g stroke="#fff" fill="none" stroke-width="3" stroke-linecap="round"><path d="M60 60L48 48M90 60l12-12M60 90L48 102M90 90l12 12M66 66h18v18H66z"/><circle cx="44" cy="44" r="5"/><circle cx="106" cy="44" r="5"/><circle cx="44" cy="106" r="5"/><circle cx="106" cy="106" r="5"/></g></svg></div><div class="cnt"><h2 style="margin:0;font:600 28px Outfit,sans-serif">Menunggu drone</h2><p style="margin:8px 0 0;font-size:14px">Belum ada data masuk dari drone. Sudah menunggu <b id="wt">00:45</b>.</p></div>
<div class="cd"><h3>Periksa dulu</h3>${['Drone sudah diletakkan di permukaan air','Modul sensor menyala','Telemetri radio terhubung ke konsol','Konsol menyala dan ponsel terhubung internet'].map((x,i)=>`<div class="li"><span class="n">${i+1}</span>${x}</div>`).join('')}</div>${tip()}<button class="bp" data-act="start">Coba lagi</button><button class="bl" data-go="home">Kembali ke beranda</button>`;

<div class="cd"><div class="kv"><span>Berhenti di menit</span><b>06:12</b></div><div class="kv"><span>Paket data diterima</span><b>82% <small style="font-weight:500;color:var(--mu)">target ≥ 95%</small></b></div><div class="kv"><span>Status kolam</span><b>Belum ditentukan</b></div></div>
<div class="cd"><h3>Yang bisa dicek</h3>${['Jarak drone ke konsol masih dekat','Telemetri radio masih tersambung','Baterai modul sensor cukup'].map((x,i)=>`<div class="li"><span class="n">${i+1}</span>${x}</div>`).join('')}</div><button class="bp" data-act="start">Ukur ulang</button><button class="bl" data-go="home">Kembali ke beranda</button>`;
V.res=()=>{const k=G.cur=='kritis'?'kritis':'waspada',c=ST[k],st=c.st;
const rows=[['Oksigen terlarut (DO)',st==2?'Kritis di bawah 3 mg/L':'Batas aman ≥ 4 mg/L','do',c.do,'mg/L'],['pH','Batas aman 7,5–8,5','ph',c.ph,''],['Suhu air','Batas aman 28–32 °C','t',c.t,'°C']].map(r=>`<div class="kv" style="align-items:center"><span><b style="display:block">${r[0]}</b><small style="color:var(--mu);font-size:12px">${r[1]}</small></span><span style="text-align:right"><b class="big" style="display:inline">${f(c[r[2]])}</b> <small>${r[4]}</small> ${ch(sk[r[2]](c[r[2]]))}</span></div>`).join('');
return hb('Hasil pengukuran','Kolam A1 · 05.41')+`<div class="hero s${st}"><span class="pl">${I(st==2?'lock':'warn',14)}${S3[st].toUpperCase()}</span><h2>${st==2?'Penerbangan terkunci':'Oksigen terlarut rendah'}</h2><p style="margin:0">${st==2?'Pakan ditunda. Porsi sesi ini 0%.':'Porsi pakan dikurangi 50%'}</p></div><div class="cd">${rows}</div>`+
(st==1?`<div class="g2"><div class="cd"><small>Izin terbang</small><b class="big">Terbuka</b><small>Terbang manual dari konsol</small></div><div class="cd"><small>Porsi sesi ini</small><b class="big">${f(por(50))} kg</b><small>50% dari ${f(full())} kg</small></div></div><div class="sb">Saran: pantau kolam lebih sering dan pertimbangkan menyalakan aerator.</div>${tip()}<button class="bp" data-go="feed">Pantau penebaran pakan</button>`:
`<div class="cd"><h3>Langkah berikutnya</h3>${['Nyalakan aerator','Tunggu kondisi air membaik','Ukur ulang sebelum menebar pakan'].map((x,i)=>`<div class="li"><span class="n${i?'':' r'}">${i+1}</span>${x}</div>`).join('')}</div>${tip()}<button class="bp" data-act="start">Ukur ulang</button><button class="bl" data-go="home">Kembali ke beranda</button>`)};
const lane=(a,mx)=>{const n=5,pr=Math.min(1,a/mx),cur=Math.min(n-1,Math.floor(pr*n)),fr=pr>=1?1:pr*n-cur;let s='';for(let i=0;i<n;i++){const d=pr>=1||i<cur,r=!d&&i==cur;s+=`<rect x="8" y="${8+i*30}" width="304" height="26" rx="6" fill="${d?'#0E7C86':r?'#5BB7BF':'#DCE8E9'}" opacity="${d?.85:1}"/>`}
const x=pr>=1?(n%2?290:30):(cur%2==0?30+fr*260:290-fr*260),y=21+Math.min(cur,n-1)*30-(pr>=1?30*0:0);return s+`<g transform="translate(${x.toFixed(0)},${pr>=1?141:y})"><circle r="12" fill="#0F2A2E"/><path d="M-5 0h10M0 -5v10" stroke="#fff" stroke-width="2"/></g>`};
V.feed=()=>hb('Penebaran pakan','Kolam A1 · Sesi 1 dari '+G.ses,'<span class="chip" style="color:#7a5200;background:#FFF0CC">Porsi 50%</span>')+`<div class="cd"><small id="fl" style="color:var(--mu)">Terbang ke-1 dari 5</small><div class="rowb" style="align-items:flex-end"><span><b class="big" style="display:inline;font-size:34px" id="fa">0,0</b> <small>kg dari ${f(full())} kg</small></span><b id="fp" style="color:var(--pri);font:600 22px Outfit">0%</b></div><div style="height:8px;border-radius:9px;background:var(--fld);margin:8px 0 12px;overflow:hidden"><b id="fb" style="display:block;height:100%;width:0;background:var(--pri);transition:width .3s"></b></div><svg viewBox="0 0 320 160" width="100%" role="img" aria-label="Jalur penebaran pakan lima lintasan"><g id="fz"></g></svg><div style="display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px"><span>■ Selesai</span><span style="color:#5BB7BF">■ Berjalan</span><span style="color:#b9cacc">■ Belum</span></div></div>
<div class="g3"><div class="cd"><small>Baterai</small><b class="big" id="fbt">82%</b></div><div class="cd"><small>Ketinggian</small><b class="big" id="fh">2,1 m</b></div><div class="cd"><small>GPS</small><b class="big" style="color:var(--c0t);font-size:20px">Terkunci</b></div></div>
<div class="sb" style="background:var(--pn);color:var(--ink)">Drone diterbangkan manual dari konsol. Jika hubungan terputus, drone mendarat perlahan dan mengapung.</div>${tip()}<button class="bo" data-go="home">Kembali ke beranda</button>`;
R.feed=()=>{let a=0;const mx=por(50),draw=()=>{const pr=a/mx,c=Math.min(5,Math.floor(pr*5)+1);$('fa').textContent=f(a);$('fp').textContent=Math.round(a/full()*100)+'%';$('fb').style.width=(a/full()*100*2)+'%';$('fl').textContent=pr>=1?'Penebaran selesai':'Terbang ke-'+c+' dari 5';$('fz').innerHTML=lane(a,mx);$('fbt').textContent=Math.round(82-21*pr)+'%';$('fh').textContent=pr>=1?'0,0 m':f(2.1+.1*Math.sin(a*3))+' m'};draw();

return `<div class="hx"><small>Kolam A1</small><h1>Riwayat</h1></div><div class="seg"><button data-tab="0" aria-pressed="${!G.tab}">Hari ini</button><button data-tab="1" aria-pressed="${!!G.tab}">7 hari</button></div>
<div class="cd"><div class="rowb"><b>${G.tab?'DO terendah per hari':'Oksigen terlarut per sesi'}</b><small style="color:var(--mu)">mg/L</small></div><svg viewBox="0 0 340 190" width="100%" role="img" aria-label="Grafik oksigen terlarut"><rect x="30" y="${Y(6)}" width="300" height="${Y(4)-Y(6)}" fill="#DDF3E6"/><rect x="30" y="${Y(4)}" width="300" height="${Y(3)-Y(4)}" fill="#FFF0CC"/><rect x="30" y="${Y(3)}" width="300" height="${Y(2)-Y(3)}" fill="#FBE0E0"/>${[2,3,4,5,6].map(v=>`<text x="4" y="${Y(v)+4}" font-size="12" fill="#4C666A">${v}</text>`).join('')}<polyline fill="none" stroke="#0F2A2E" stroke-width="2.5" points="${d.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>${pts}</svg><div style="display:flex;gap:12px;font-size:12px;color:var(--mu)"><span>■ Aman ≥ 4</span><span>■ 3–4</span><span>■ &lt; 3</span></div>${G.tab?'<small style="color:var(--mu);font-size:12px">Data contoh untuk demo</small>':''}</div>${list}`};
const fld=(id,l,v)=>`<label class="fl">${l}<input id="${id}" inputmode="decimal" value="${v}"></label>`;
V.set=()=>{const F=full();return `<div class="hx"><small>Kolam A1</small><h1>Pengaturan</h1></div><div class="cd"><h3>Data udang</h3><p style="margin:0 0 10px;font-size:13px;color:var(--mu)">Isi dari hasil sampling dan tabel pakan Anda</p><div class="g2">${fld('i0','Populasi hidup (ekor)','425.000')}${fld('i1','Bobot rata-rata (g)','10,37')}${fld('i2','Feeding rate (%/hari)','4,32')}${fld('i3','Sesi pakan per hari','4')}</div></div>
<div class="pt"><small>Porsi pakan per sesi</small><b class="big" id="pf">${f(F)} kg</b><div class="g3"><div>Aman<b id="p0">${f(F)} kg</b></div><div>Waspada<b id="p1">${f(F/2)} kg</b></div><div>Kritis<b>0 kg</b></div></div></div>
<div class="cd" style="padding:4px 14px">${[['amb','Ambang batas status'],['jad','Jadwal sesi pakan'],['lock','Notifikasi dorong']].map(r=>`<button class="lr" data-${r[0]=='lock'?'go':'sh'}="${r[0]}">${r[1]}${I('chev',18)}</button>`).join('')}</div><div class="cd dc"><h4 style="width:100%;color:var(--ink)">Mode demo · hasil pengukuran berikutnya</h4>${demo(1)}</div>`};

function go(s){clearInterval(T);G.scr=s;G.sel=null;draw()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act],[data-sc],[data-tab],[data-sh],[data-nf]');if(e.target.id=='sht'){$('sht').hidden=true;return}if(!b)return;const d=b.dataset;

else if(d.sh){const s=SH[d.sh];$('sht').innerHTML=`<div class="cd"><h3>${s[0]}</h3>${s[1].map(r=>`<div class="kv"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}<button class="bp" style="margin-top:14px" data-act="x">Tutup</button></div>`;$('sht').hidden=false}
